[project]
name = "nuPac-eporner"
version = "0.1.0"
description = "A scraping package for eporner and depends on intergration into nuPac"
readme = "README.md"
requires-python = ">=3.14"
license = "Unlicense"
keywords = ["nuPac", "eporner", "adult", "cam", "download", "scrape", "video", "webcam"]
dependencies = []

[tool.pyright]
exclude = ["**/.*", "**/node_modules", "**/__pycache__", "**/_experiments", ".vscode/*.py", "**/dist", "**/site-packages/**/*.py", ".venv"]
linetoolong = false

[tool.ruff.lint]
# Avoid enforcing line-length violations
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nuPac"]
